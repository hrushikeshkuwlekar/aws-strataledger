[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-strataledger"
version = "1.0.1"
description = "Multi-account AWS inventory discovery with interactive topology reports"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "boto3>=1.35.0",
    "click>=8.1",
    "jinja2>=3.1",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.scripts]
aws-strataledger = "aws_strataledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aws_strataledger.report" = ["templates/*.html"]
