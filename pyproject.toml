[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-strataledger"
version = "1.1.0"
description = "Multi-account AWS inventory discovery with interactive topology reports"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "boto3>=1.35.0",
    "click>=8.1",
    "jinja2>=3.1",
    "markupsafe>=2.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "moto[all]>=5.0",
    "ruff>=0.4",
]

[project.scripts]
aws-strataledger = "aws_strataledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aws_strataledger.report" = ["templates/*.html"]
